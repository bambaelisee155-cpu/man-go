<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5C40">
<meta name="description" content="Man-Go : taxis communaux et tricycles de Man et de sa région.">
<title>Man-Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Mise en page : une colonne mobile unique, en-tête collant avec quatre espaces (passager, chauffeur, tarifs, lancement).
   Couleurs : latérite de Man pour l'action, vert forêt pour l'arrivée et l'état "en ligne", jaune mangue pour les véhicules et les notes. */
:root{
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#EBEFE8; --surface:#FBFCFA; --surface-2:#F0F3EE; --ink:#15201A; --muted:#566559; --line:#D3DACF;
  --accent:#C2461B; --on-accent:#FFFFFF; --forest:#1E5C40; --forest-soft:#DDEBE2; --sun:#E3A312; --err:#B3261E;
  --map:#E0E8DB; --road:#F6F8F3; --hill:#B9CDBE; --dot:#6B7D70;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#17201B; --surface-2:#1D2822; --ink:#E7EEE8; --muted:#9AAA9F; --line:#2B3830;
    --accent:#EE7A47; --on-accent:#1B0D06; --forest:#7CCBA3; --forest-soft:#1D3A2B; --sun:#F2C14E; --err:#F2766E;
    --map:#14201A; --road:#243229; --hill:#2A4033; --dot:#7E9185; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17201B; --surface-2:#1D2822; --ink:#E7EEE8; --muted:#9AAA9F; --line:#2B3830;
  --accent:#EE7A47; --on-accent:#1B0D06; --forest:#7CCBA3; --forest-soft:#1D3A2B; --sun:#F2C14E; --err:#F2766E;
  --map:#14201A; --road:#243229; --hill:#2A4033; --dot:#7E9185; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.shell{max-width:460px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:12px 0 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font:800 24px/1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.brand .pill{margin-left:auto}
.pill{font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tab{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 13px var(--f-body);cursor:pointer;padding:0 2px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}

.stack{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card.flat{background:var(--surface-2);border-radius:14px;padding:12px}
h2{font:800 22px/1.15 var(--f-display);margin:0 0 8px;text-wrap:balance}
h3{font:800 17px/1.2 var(--f-display);margin:0 0 6px;text-wrap:balance}
p{margin:0 0 8px}
.eyebrow{font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.fine{color:var(--muted);font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.map{display:block;width:100%;height:auto;border-radius:14px;background:var(--map);border:1px solid var(--line)}
.map .lbl{font:700 9.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:3px}
.cap{margin:6px 2px 0;color:var(--muted);font-size:12px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lab{font:700 13px/1.2 var(--f-body)}
.inp{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:0 12px;font:500 16px var(--f-body)}
textarea.inp{min-height:180px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp.num{font-family:var(--f-mono);min-width:96px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.form{display:flex;flex-direction:column;gap:14px}

.svcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.svc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;min-height:88px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;font:inherit;text-align:left;cursor:pointer;min-width:0}
.svc svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px}
.svc b{font:700 14px/1.15 var(--f-body)}
.svc small{color:var(--muted);font-size:12px}
.svc[aria-pressed=true]{border-color:var(--accent);background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent)}
.svc[aria-pressed=true] svg{stroke:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font:600 14px var(--f-body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 20px var(--f-body);cursor:pointer}
.stepper output{min-width:28px;text-align:center;font:500 20px var(--f-mono)}

.fare{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:14px;border-radius:14px;background:var(--forest-soft)}
.fare span{font-weight:600}
.fare strong{font:500 28px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.fare small{flex-basis:100%;color:var(--muted);font-size:12px}
.old{text-decoration:line-through;color:var(--muted);font:500 14px var(--f-mono)}

.btn{display:inline-flex;justify-content:center;align-items:center;min-height:52px;padding:0 20px;border-radius:14px;border:0;font:800 16px var(--f-display);cursor:pointer;width:100%;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.forest{background:var(--forest);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;width:auto;font-size:15px;padding:0 16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 120px}

.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0;padding:0}
.steps li{font-size:12px;font-weight:700;color:var(--muted);padding-top:8px;border-top:4px solid var(--line)}
.steps li.done{border-color:var(--forest);color:var(--forest)}
.steps li.cur{border-color:var(--accent);color:var(--ink)}

.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.stat{display:flex;gap:12px;align-items:center}
.stat h2{margin:0}

.drv{display:flex;gap:12px;align-items:center}
.ava{flex:none;width:48px;height:48px;border-radius:50%;background:var(--forest-soft);color:var(--forest);display:grid;place-items:center;font:800 17px var(--f-display)}
.drv-t{display:flex;flex-direction:column;min-width:0}
.drv-t span{color:var(--muted);font-size:13px}
.tag{margin-left:auto;font:700 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);flex:none}
.tag.hot{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.near{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.near li{display:flex;gap:10px;align-items:center}
.near .ava{width:38px;height:38px;font-size:14px}
.near .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.near .t span{color:var(--muted);font-size:12px}
.near .d{font:500 13px var(--f-mono);text-align:right;white-space:nowrap}
.gpsrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.code{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px;border-radius:14px;border:1.5px dashed var(--accent)}
.code strong{font:500 34px/1 var(--f-mono);letter-spacing:.16em}
.code p{flex-basis:100%;margin:0;color:var(--muted);font-size:13px}

dl.sum{margin:0;display:grid;gap:8px}
dl.sum div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
dl.sum div:last-child{border-bottom:0;padding-bottom:0}
dl.sum dt{color:var(--muted)}
dl.sum dd{margin:0;font-weight:700;text-align:right;min-width:0}

.stars{display:flex;gap:4px}
.stars button{width:44px;height:44px;border:0;background:transparent;font-size:30px;line-height:1;color:var(--line);cursor:pointer}
.stars button[aria-pressed=true]{color:var(--sun)}

.switch{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 18px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font:800 16px var(--f-display);cursor:pointer}
.switch .knob{width:40px;height:40px;border-radius:50%;background:var(--muted)}
.switch[aria-checked=true]{background:var(--forest-soft);border-color:var(--forest)}
.switch[aria-checked=true] .knob{background:var(--forest)}
.switch:disabled{opacity:.5;cursor:not-allowed}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.earn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.earn div{background:var(--surface-2);border-radius:12px;padding:12px}
.earn span{display:block;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.earn strong{display:block;font:500 22px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}

.req{display:flex;flex-direction:column;gap:10px}
.req .rt{font:800 17px/1.2 var(--f-display)}
.req .meta{color:var(--muted);font-size:13px}
.req .price{font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.req .head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.notice{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.err{color:var(--err);font-weight:600;margin:0}

.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
.goals div{background:var(--surface-2);border-radius:12px;padding:10px}
.goals strong{display:block;font:500 26px/1.1 var(--f-mono)}
.goals span{font-size:12px;color:var(--muted);line-height:1.3;display:block}

details.acc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
details.acc summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:800 17px/1.2 var(--f-display)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font:500 22px var(--f-mono);color:var(--accent)}
details.acc[open] summary::after{content:"\2212"}
details.acc .in{padding:0 0 16px}
details.acc ul,details.acc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:380px;font-size:13px}
.tbl th,.tbl td{text-align:left;vertical-align:middle;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
.tbl th{font-weight:700;color:var(--muted)}
.badge{display:inline-block;font:700 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--sun);color:#1B1405;margin-right:6px;vertical-align:1px}

html,body{margin:0}
.mapbox{position:relative;z-index:0;isolation:isolate;height:300px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--map)}
.mapbox.leaflet-container{font-family:var(--f-body)}
.gdot{width:18px;height:18px;border-radius:50%;background:#2a6fdb;border:3px solid #fff;box-shadow:0 0 0 2px rgba(42,111,219,.35)}
.pin{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.veh{width:16px;height:16px;border-radius:4px;background:var(--sun);border:2px solid #15201A}
.veh.live{background:#1E5C40;border-color:#fff}
textarea.rep{min-height:150px;font:500 12px/1.4 var(--f-mono)}
.tag.ok{background:var(--forest-soft);color:var(--forest);border-color:var(--forest)}
.tag.warn{background:var(--sun);color:#1B1405;border-color:var(--sun)}
.foot{margin:6px 2px 0;color:var(--muted);font-size:13px}
.foot a{color:var(--accent);font-weight:700}
.card a{color:var(--accent);font-weight:700}
.near .tag{margin-left:0}
.stat+.drv{margin-top:2px}
</style>
</head>
<body data-app="passager">
<noscript>Man-Go a besoin de JavaScript pour fonctionner.</noscript>
<div class="shell"><div id="app"></div></div>
<div id="live" class="sr" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';

/* Une seule base de code pour trois pages : passager (index.html), chauffeur (chauffeur.html), gestion (gestion.html). */
var APP=document.body.getAttribute('data-app')||'passager';
var TABS={
  passager:[['commander','Commander'],['aide','Aide et GPS']],
  chauffeur:[['courses','Courses'],['dossier','Mon dossier'],['aide','Aide et GPS']],
  gestion:[['tarifs','Tarifs'],['lieux','Lieux'],['chauffeurs','Chauffeurs'],['plan','Plan']]
};
var BRAND={
  passager:['Man-Go','Taxis et tricycles de Man et sa région'],
  chauffeur:['Man-Go Chauffeur','Recevez des courses à Man'],
  gestion:['Man-Go Gestion','Tarifs, lieux et chauffeurs']
};

var CONF=window.MANGO||{};
var ONLINE=!!(CONF.url&&CONF.key);
var SK='mango_sess_'+APP,SESS=null;
try{SESS=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){SESS=null}

/* Centre de Man : 7°24' N, 7°33' O (Wikipédia). Point de départ de la carte tant que le GPS n'a pas répondu. */
var MAN={lat:7.40,lon:-7.55};
var RADIUS=3000; /* distance maximale pour proposer un véhicule, en mètres */

/* ---------- Réglages ---------- */
/* Seuls Gbêpleu et Kennedy figurent dans une source consultée. Lycée Club vient de vous. Le reste est à vérifier avec des habitants de Man. */
var DEF_Q=['Gare routière','Marché','CHR de Man','Libreville','Air France','Dioulabougou','Kennedy','Gbêpleu','Lycée Club','Cascade de Man','Dent de Man'];
/* Tarifs habituels depuis Man : ESTIMATIONS de départ, aucune source fiable trouvée. */
var DEF_T=[['Logoualé',1500],['Biankouma',3000],['Facobly',3000],['Danané',4000],['Duékoué',4000],['Guiglo',5000],['Bangolo',5000],['Touba',6500],['Sipilou',4000]];
/* Exemple de test donné par vous : Gbêpleu vers Lycée Club à 3 000 FCFA. */
var DEF_R=[{a:'Gbêpleu',b:'Lycée Club',p:3000,ex:true}];

function cp(o){return JSON.parse(JSON.stringify(o))}
function defCfg(){return {q:DEF_Q.slice(),t:DEF_T.map(function(x){return {n:x[0],u:x[1]}}),city:500,red:500,com:10,routes:cp(DEF_R)}}
function rd(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function wr(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function loadCfg(){
  var c=rd('mango_cfg');
  if(c&&Array.isArray(c.q)&&c.q.length>1&&Array.isArray(c.t)&&c.t.length){
    if(typeof c.com!=='number')c.com=10;
    if(!Array.isArray(c.routes))c.routes=cp(DEF_R);
    return c;
  }
  return defCfg();
}
function saveCfg(){wr('mango_cfg',CFG);if(ONLINE&&APP==='gestion')pushCfg()}

var CFG=loadCfg();
var P={},INTER={};
function slug(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x'}
function rebuild(){
  P={};INTER={};
  CFG.q.forEach(function(n){var k=slug(n);if(!P[k])P[k]={n:n}});
  CFG.t.forEach(function(t){
    var k=slug(t.n);if(INTER[k])return;
    INTER[k]={n:t.n,usual:t.u,fare:Math.max(500,t.u-CFG.red),v:!!t.v};
  });
}
rebuild();

var PAY={cash:'Espèces',wave:'Wave',om:'Orange Money',mtn:'MTN MoMo'};
var SVC={taxi:'Taxi communal',tri:'Tricycle',inter:'Hors ville'};
var DRV=[
  {name:'Moussa Traoré',svc:'taxi',rate:4.8,trips:312},
  {name:'Daouda Koné',svc:'taxi',rate:4.7,trips:189},
  {name:'Emmanuel Gnahoré',svc:'taxi',rate:4.9,trips:421},
  {name:'Yves Kouadio',svc:'taxi',rate:4.5,trips:64},
  {name:'Séraphin Zadi',svc:'tri',rate:4.8,trips:156},
  {name:'Ibrahim Ouattara',svc:'tri',rate:4.6,trips:98},
  {name:'Lassina Diomandé',svc:'tri',rate:4.7,trips:71}
];
var NAMES=['Awa','Marie-Claire','Yao','Fatoumata','Serge','Nadège','Kader','Estelle'];

var S={tab:TABS[APP][0][0],svc:'taxi',from:'',to:'',pax:1,pay:'cash',ride:null,
  gps:null,pin:null,pickMode:'gps',geoState:'idle',geoMsg:'',perm:'unknown',centre:{lat:MAN.lat,lon:MAN.lon},fleet:[],netDr:[],
  online:false,requests:[],real:null,skipped:{},job:null,earn:{t:0,n:0},reg:ONLINE?null:rd('mango_reg'),editing:false,
  form:{rv:'taxi',towns:[]},regErr:'',townErr:'',routeErr:'',notice:'',codeErr:false,sf:'',st:'',
  installEv:null,installed:false,reportText:'',copied:''};
var uid=0,T=null,IV=null,HB=null,WATCH=null,lastR=0,MAP=null,mapEl=null,layers={},mapReady=false;

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' FCFA'}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[rnd(0,a.length-1)]}
function r50(n){return Math.round(n/50)*50}
function num(v){var n=parseInt(String(v).replace(/\D/g,''),10);return isNaN(n)?0:n}
function announce(m){var l=$('#live');if(l)l.textContent=m}
function opt(v,l,sel){return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(l)+'</option>'}
function maxPax(){return S.svc==='tri'?3:4}
function placeName(svc,k){return svc==='inter'?(INTER[k]?INTER[k].n:k):(P[k]?P[k].n:k)}
function ini(n){return String(n).split(/\s+/).map(function(w){return w.charAt(0).toUpperCase()}).slice(0,2).join('')}
function pad2(n){return (n<10?'0':'')+n}

/* ---------- Mode en ligne : connexion à Supabase (REST, sans bibliothèque) ---------- */
var ERRS=[
  ['active_ride','Vous avez déjà une course en cours.'],['rate_limit','Trop de demandes. Réessayez plus tard.'],
  ['unknown_place','Lieu inconnu. Rechargez la page.'],['same_place','Choisissez deux lieux différents.'],
  ['taken','Cette course vient d’être prise par un autre chauffeur.'],['busy','Terminez d’abord votre course en cours.'],
  ['not_approved','Votre compte n’est pas encore approuvé.'],['bad_code','Ce code ne correspond pas.'],
  ['bad_state','Cette action n’est plus possible.'],['cannot_cancel','Cette course ne peut plus être annulée.'],
  ['Invalid login credentials','Numéro, e-mail ou mot de passe incorrect.'],['already registered','Ce numéro a déjà un compte. Connectez-vous.'],
  ['confirm_email','Le serveur demande une confirmation par e-mail. Désactivez « Confirm email » dans Supabase.'],
  ['Anonymous sign-ins are disabled','Les connexions anonymes sont désactivées dans Supabase.'],
  ['no_session','Session expirée. Reconnectez-vous.'],['Failed to fetch','Pas de connexion internet.'],['NetworkError','Pas de connexion internet.'],
  ['bad_phone','Numéro de téléphone invalide.'],['bad_name','Nom invalide.'],['bad_plate','Plaque invalide.'],['Password should be','Mot de passe trop court (6 caractères minimum).']
];
function errTxt(e){var m=String((e&&e.message)||e||'');for(var i=0;i<ERRS.length;i++)if(m.indexOf(ERRS[i][0])>=0)return ERRS[i][1];return 'Erreur : '+m}
function hdrs(tok,extra){
  var h={'apikey':CONF.key,'Content-Type':'application/json'};
  if(tok)h['Authorization']='Bearer '+tok;
  else if(/^eyJ/.test(CONF.key))h['Authorization']='Bearer '+CONF.key;
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;
}
function http(method,path,body,tok,extra){
  return fetch(CONF.url.replace(/\/+$/,'')+path,{method:method,headers:hdrs(tok,extra),body:body===undefined?undefined:JSON.stringify(body)}).then(function(r){
    return r.text().then(function(t){
      var j=null;try{j=t?JSON.parse(t):null}catch(x){}
      if(!r.ok){var e=new Error((j&&(j.message||j.msg||j.error_description||j.error))||('HTTP '+r.status));e.status=r.status;throw e}
      return j;
    });
  });
}
function setSess(s){SESS=s;wr(SK,s)}
function sessFrom(j){
  if(!j||!j.access_token)throw new Error('confirm_email');
  return {at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,uid:j.user&&j.user.id};
}
function signIn(email,pw){return http('POST','/auth/v1/token?grant_type=password',{email:email,password:pw}).then(function(j){setSess(sessFrom(j))})}
function signUp(email,pw){return http('POST','/auth/v1/signup',{email:email,password:pw}).then(function(j){setSess(sessFrom(j))})}
function signAnon(){return http('POST','/auth/v1/signup',{data:{},gotrue_meta_security:{}}).then(function(j){setSess(sessFrom(j))})}
function token(){
  if(SESS&&Date.now()<SESS.exp)return Promise.resolve(SESS.at);
  if(SESS&&SESS.rt)return http('POST','/auth/v1/token?grant_type=refresh_token',{refresh_token:SESS.rt}).then(function(j){setSess(sessFrom(j));return SESS.at},function(e){
    if(e.status>=400&&e.status<500){setSess(null);return token()}
    throw e;
  });
  if(APP==='passager')return signAnon().then(function(){return SESS.at});
  return Promise.reject(new Error('no_session'));
}
function authed(method,path,body,extra,retry){
  return token().then(function(t){return http(method,path,body,t,extra)}).catch(function(e){
    if(e.status===401&&!retry&&SESS){SESS.exp=0;return authed(method,path,body,extra,true)}
    throw e;
  });
}
function rpc(name,args){return authed('POST','/rest/v1/rpc/'+name,args||{})}
function normPhone(s){var p=String(s||'').replace(/\D/g,'');if(p.length===13&&p.indexOf('225')===0)p=p.slice(3);return p}
function drvEmail(p){return 'mgchauffeur225'+p+'@'+(CONF.emailDomain||'gmail.com')}
function hhmm(){var d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes())}

function validCfg(c){return !!(c&&Array.isArray(c.q)&&c.q.length>1&&Array.isArray(c.t)&&c.t.length&&typeof c.city==='number'&&typeof c.red==='number'&&typeof c.com==='number')}
function loadRemoteCfg(){
  return http('GET','/rest/v1/settings?id=eq.1&select=config').then(function(a){
    var c=a&&a[0]&&a[0].config;
    if(validCfg(c)){
      if(!Array.isArray(c.routes))c.routes=[];
      CFG=c;wr('mango_cfg',CFG);rebuild();fixFrom();fixTo();fixSim();S.cfgLoaded=true;S.cfgErr='';
    }else S.cfgErr='Réglages en ligne introuvables. Vérifiez que supabase.sql a bien été exécuté.';
  }).catch(function(e){S.cfgErr=errTxt(e)}).then(function(){softRender()});
}
function gated(){return ONLINE&&APP==='gestion'&&!(SESS&&S.isAdmin===true&&S.cfgLoaded)}

/* --- Passager --- */
function pollNear(){
  if(!ONLINE||APP!=='passager'||S.ride||document.hidden)return;
  var ref=pickup()||S.centre;
  rpc('nearby_drivers',{p_lat:ref.lat,p_lon:ref.lon,p_svc:S.svc==='tri'?'tri':'taxi',p_radius:RADIUS}).then(function(a){
    var sig=JSON.stringify(a||[]);
    if(sig!==S.nearSig){S.nearSig=sig;S.netDr=a||[];softRender();drawMap()}
  }).catch(function(){});
}
function mapRide(j,old){
  var d=j.driver;
  return {id:j.id,status:j.status,svc:j.svc,fromN:j.from_n,toN:j.to_n,pax:j.pax,pay:j.pay,fare:j.fare,code:j.code,eta:j.eta,
    pickup:(old&&old.pickup)||{lat:j.plat,lon:j.plon,label:j.plabel||'Point de départ',kind:'pin'},
    driver:d?{name:d.name,veh:d.veh==='tri'?'Tricycle':'Taxi communal',plate:d.plate,ini:ini(d.name),rate:null,trips:0,ex:false}:null,
    rating:old?old.rating:0,net:true,sim:false,t0:old?old.t0:Date.now()};
}
function orderNet(f){
  if(S.ordering)return;
  var p=pickup();
  if(!p){S.notice='Activez votre position ou touchez la carte pour indiquer votre départ.';render();return}
  S.ordering=true;S.notice='';
  rpc('create_ride',{p_svc:S.svc,p_from:P[S.from].n,p_to:placeName(S.svc,S.to),p_pax:S.pax,p_pay:S.pay,p_lat:p.lat,p_lon:p.lon,p_label:p.label}).then(function(r){
    S.ride={id:r.id,status:'requested',svc:S.svc,fromN:P[S.from].n,toN:placeName(S.svc,S.to),pax:S.pax,pay:S.pay,fare:f,pickup:p,driver:null,rating:0,net:true,sim:false,t0:Date.now()};
    announce('Demande envoyée.');render();fitView();window.scrollTo(0,0);
  }).catch(function(e){S.notice=errTxt(e);render()}).then(function(){S.ordering=false});
}
function pollRide(){
  if(!ONLINE||APP!=='passager'||S.rideBusy)return;
  var r=S.ride;
  if(r&&(!r.id||r.status==='nodriver'))return;
  S.rideBusy=true;
  rpc('my_ride').then(function(j){
    var cur=S.ride;
    if(!j){
      if(cur&&cur.id&&cur.status!=='nodriver'&&Date.now()-cur.t0>5000){S.ride=null;S.notice='La course n’est plus active.';render();fitView()}
      return;
    }
    var same=cur&&cur.id===j.id;
    var n=mapRide(j,same?cur:null);
    var changed=!same||cur.status!==n.status||cur.eta!==n.eta||cur.code!==n.code||cur.fare!==n.fare||(cur.driver&&n.driver&&cur.driver.name!==n.driver.name)||(!cur.driver&&!!n.driver);
    S.ride=n;
    if(changed){announce(RIDE_MSG[n.status]||'');render();if(!same)fitView()}
    if(n.status==='requested'&&Date.now()-n.t0>120000){
      return rpc('cancel_ride',{p_id:n.id}).catch(function(){}).then(function(){
        if(S.ride&&S.ride.id===n.id){S.ride.status='nodriver';announce(RIDE_MSG.nodriver);render()}
      });
    }
  }).catch(function(){}).then(function(){S.rideBusy=false});
}
function cancelNet(r){
  var done=function(){S.ride=null;S.notice='';announce('Course annulée.');render();fitView()};
  if(!r.id||r.status==='nodriver'||r.status==='done'){done();return}
  rpc('cancel_ride',{p_id:r.id}).then(done,function(e){S.notice=errTxt(e);render()});
}

/* --- Chauffeur --- */
function mapJob(j){
  return {id:j.id,status:j.status,svc:j.svc,fromN:j.from_n,toN:j.to_n,pax:j.pax,pay:j.pay,fare:j.fare,com:j.com,net:j.net,pct:j.pct,
    pickup:{lat:j.plat,lon:j.plon,label:j.plabel||'Point de départ'},src:'net'};
}
function mapReq(j){
  var q=mapJob(j);
  q.dist=S.gps&&j.plat!==null?Math.round(hav(S.gps,{lat:j.plat,lon:j.plon})):null;
  return q;
}
function refreshDoss(){
  if(!SESS)return Promise.resolve();
  return authed('GET','/rest/v1/drivers?user_id=eq.'+encodeURIComponent(SESS.uid)+'&select=*').then(function(a){
    var d=a&&a[0];
    var n=d?{name:d.name,phone:d.phone,veh:d.veh,plate:d.plate,station:d.station||'',inter:!!d.inter,towns:d.towns||[],status:d.status}:null;
    S.lastDoss=Date.now();
    if(!S.editing){var ch=JSON.stringify(n)!==JSON.stringify(S.reg);S.reg=n;if(ch)softRender()}
  }).catch(function(){});
}
function restoreJob(){
  if(!SESS||!approved())return Promise.resolve();
  return rpc('my_job').then(function(j){
    if(j&&!S.job){
      S.job=mapJob(j);S.online=true;clearInterval(HB);
      if(WATCH===null&&S.perm!=='denied')startGeo();
      heartbeat();HB=setInterval(heartbeat,5000);render();
    }
  }).catch(function(){});
}
function heartbeatNet(){
  if(!S.gps||!SESS)return;
  var n=Date.now();if(n-(S.lastHb||0)<4000)return;S.lastHb=n;
  rpc('set_live',{p_lat:S.gps.lat,p_lon:S.gps.lon}).catch(function(e){
    if(/not_approved/.test(String(e.message))){S.online=false;clearInterval(HB);S.notice=errTxt(e);softRender()}
  });
}
function pollDriverNet(){
  if(!SESS||S.netBusy)return;
  S.netBusy=true;
  var p=(!S.editing&&Date.now()-(S.lastDoss||0)>8000)?refreshDoss():Promise.resolve();
  p.then(function(){
    if(!S.online||!approved())return;
    if(S.job){
      if(S.job.status==='done')return;
      return rpc('my_job').then(function(j){if(!j){S.job=null;S.notice='La course a été annulée par le passager.';softRender()}});
    }
    if(!S.gps)return;
    return rpc('open_requests',{p_lat:S.gps.lat,p_lon:S.gps.lon}).then(function(a){
      var list=(a||[]).map(mapReq).filter(function(q){return !S.skipped[q.id]});
      var sig=list.map(function(q){return q.id}).join(',');
      if(sig!==S.reqSig){S.reqSig=sig;S.requests=list;softRender()}
    });
  }).catch(function(){}).then(function(){S.netBusy=false});
}
function acceptNet(id){
  rpc('accept_ride',{p_id:id}).then(function(j){
    S.job=mapJob(j);S.requests=[];S.reqSig='';S.form.codeIn='';S.codeErr=false;render();
  }).catch(function(e){
    S.notice=errTxt(e);S.requests=S.requests.filter(function(x){return x.id!==id});S.reqSig='';render();
  });
}
function arriveNet(){
  var j=S.job;if(!j)return;
  rpc('arrive_ride',{p_id:j.id}).then(function(r){Object.assign(S.job,mapJob(r));announce('Arrivé au départ.');render()}).catch(function(e){S.notice=errTxt(e);render()});
}
function startNet(j){
  rpc('start_ride',{p_id:j.id,p_code:String(S.form.codeIn||'').trim()}).then(function(r){
    Object.assign(S.job,mapJob(r));S.codeErr=false;S.form.codeIn='';announce('Course démarrée.');render();
  }).catch(function(e){
    if(/bad_code/.test(String(e.message)))S.codeErr=true;else S.notice=errTxt(e);
    render();
  });
}
function finishNet(j){
  rpc('finish_ride',{p_id:j.id}).then(function(r){
    Object.assign(S.job,mapJob(r));
    if(!S.job.paid){S.job.paid=true;S.earn.t+=S.job.net;S.earn.n+=1}
    announce('Course terminée. Gains ajoutés.');render();
  }).catch(function(e){S.notice=errTxt(e);render()});
}
function submitRegNet(rec,ph,pw){
  if(!SESS&&pw.length<6){S.regErr='Choisissez un mot de passe d’au moins 6 caractères.';render();return}
  S.regErr='';
  var go=SESS?Promise.resolve():signUp(drvEmail(ph),pw);
  go.then(function(){
    return rpc('submit_driver',{p_name:rec.name,p_phone:rec.phone,p_veh:rec.veh,p_plate:rec.plate,p_station:rec.station,p_inter:rec.inter,p_towns:rec.towns});
  }).then(function(){
    S.reg=Object.assign({},rec,{status:'pending'});S.editing=false;S.form.rw='';announce('Dossier envoyé.');
  }).catch(function(e){S.regErr=errTxt(e)}).then(render);
}
function doLogin(){
  var ph=normPhone(S.form.lp),pw=S.form.lw||'';
  if(ph.length!==10||!pw){S.authErr='Entrez votre numéro à 10 chiffres et votre mot de passe.';render();return}
  signIn(drvEmail(ph),pw).then(function(){S.authErr='';S.form.lw='';return refreshDoss()}).then(function(){
    S.tab=S.reg?'courses':'dossier';return restoreJob();
  }).catch(function(e){S.authErr=errTxt(e)}).then(render);

    if(S.isAdmin)startAdmin();else S.authErr='Ce compte n’a pas les droits d’administration.';

function startAdmin(){
  loadRemoteCfg();loadDrivers();
  if(!S.admIv)S.admIv=setInterval(function(){if(S.isAdmin&&S.tab==='chauffeurs'&&!document.hidden)loadDrivers()},10000);
}
function doAdminLogin(){
  var em=String(S.form.ae||'').trim(),pw=S.form.aw||'';
  if(!em||!pw){S.authErr='Entrez votre e-mail et votre mot de passe.';render();return}
  signIn(em,pw).then(function(){S.form.aw='';S.authErr='';S.isAdmin=undefined;render();return rpc('is_admin')}).then(function(ok){
    if(ok===true){S.isAdmin=true;S.authErr='';startAdmin()}
    else{S.isAdmin=false;S.authErr='Ce compte n’a pas les droits d’administration.';setSess(null)}
  }).catch(function(e){S.isAdmin=false;S.authErr=errTxt(e)}).then(render);

  if(!ONLINE)return;
  loadRemoteCfg();

/* ---------- Prix ---------- */
/* Prix en ville : tarif spécial entre deux quartiers s'il existe, sinon le prix fixe en ville. */
function special(fk,tk){
  for(var i=0;i<CFG.routes.length;i++){
    var r=CFG.routes[i],ka=slug(r.a),kb=slug(r.b);
    if((ka===fk&&kb===tk)||(ka===tk&&kb===fk))return r.p;
  }
  return 0;
}
function fare(svc,from,to){

/* ---------- Géométrie ---------- */
function hav(a,b){
  var R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
  var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function offset(c,m,brg){
  var r=Math.PI/180;
  return {lat:c.lat+m*Math.cos(brg)/111320,lon:c.lon+m*Math.sin(brg)/(111320*Math.cos(c.lat*r))};
}
function distLabel(m){
  if(m<100)return 'moins de 100 m';
  if(m<1000)return r50(m)+' m';
  return (m/1000).toFixed(1).replace('.',',')+' km';
}

}

/* ---------- GPS ---------- */
var GEO_TXT={idle:'Pas encore activé',asking:'Recherche en cours',ok:'Position reçue',denied:'Autorisation refusée',nopos:'Position indisponible',timeout:'Délai dépassé',insecure:'Page non sécurisée',unsupported:'Non pris en charge'};
function permLabel(){return {granted:'Accordée',denied:'Refusée',prompt:'À demander'}[S.perm]||'Inconnue'}
function accLabel(a){return a<=30?'Bonne':a<=100?'Moyenne':'Faible'}
function geoRender(force){
  var n=Date.now();
  if(force||n-lastR>3000){lastR=n;softRender()}else drawMap();
}
function onFix(p){
  var acc=Math.round(p.coords.accuracy);
  /* Ignore une mesure bien moins précise qui arrive juste après une bonne. */
  if(S.gps&&S.gps.acc<50&&acc>3*S.gps.acc&&Date.now()-S.gps.ts<10000)return;
  var first=!S.gps;
  S.gps={lat:p.coords.latitude,lon:p.coords.longitude,acc:acc,ts:p.timestamp,speed:p.coords.speed,heading:p.coords.heading};
  S.geoState='ok';S.geoMsg='';S.perm='granted';
  if(first){S.centre={lat:S.gps.lat,lon:S.gps.lon};if(!S.ride)makeFleet()}
  if(S.online)heartbeat();
  geoRender(first);
  if(first)fitView();
}
function onErr(e){
  var c=e&&e.code;
  if(c===1){
    S.geoState='denied';S.perm='denied';WATCH=null;
    S.geoMsg='Le navigateur n’a pas la permission d’utiliser votre position. Sous Chrome, touchez le cadenas à gauche de l’adresse, puis Autorisations, puis Position : Autoriser. Rechargez ensuite la page.';
  }else if(c===3){
    S.geoState='timeout';
    S.geoMsg='Le téléphone met trop de temps à trouver votre position. Sortez à l’air libre et attendez quelques secondes.';
  }else{
    S.geoState='nopos';
    S.geoMsg='Position indisponible. Vérifiez que la localisation (GPS) du téléphone est activée dans les réglages Android.';
  }
  geoRender(true);
}
function startGeo(){
  if(!window.isSecureContext){S.geoState='insecure';S.geoMsg='Le GPS ne fonctionne que sur une adresse qui commence par https://. Ouvrez le site depuis son adresse en ligne.';render();return}
  if(!('geolocation' in navigator)){S.geoState='unsupported';S.geoMsg='Ce navigateur ne sait pas donner la position. Essayez avec Chrome.';render();return}
  stopGeo(true);
  S.geoState='asking';S.geoMsg='';render();
  try{WATCH=navigator.geolocation.watchPosition(onFix,onErr,{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
  catch(e){onErr({code:2})}
}
function stopGeo(silent){
  if(WATCH!==null){try{navigator.geolocation.clearWatch(WATCH)}catch(e){}WATCH=null}
  if(!silent){S.geoState='idle';S.geoMsg='GPS arrêté.';render()}
}
function watchPerm(){
  try{
    if(navigator.permissions&&navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(function(p){
        S.perm=p.state;
        if(p.state==='granted'&&APP!=='gestion'&&WATCH===null&&S.geoState==='idle')startGeo();
        p.onchange=function(){S.perm=p.state;softRender()};
        softRender();
      }).catch(function(){});
    }
  }catch(e){}
}
function report(){
  var g=S.gps;
  return ['Rapport de test Man-Go ('+BRAND[APP][0]+')',
    'Date : '+new Date().toLocaleString('fr-FR'),
    'Adresse sécurisée (https) : '+(window.isSecureContext?'oui':'non'),
    'Autorisation : '+permLabel(),
    'État : '+(GEO_TXT[S.geoState]||S.geoState),
    g?'Position : '+g.lat.toFixed(5)+', '+g.lon.toFixed(5)+' (précision environ '+g.acc+' m)':'Position : aucune',
    'Navigateur : '+navigator.userAgent].join('\n');
}
function copyReport(){
  var t=report();
  var done=function(){S.copied='Rapport copié.';S.reportText='';render()};
  var fb=function(){S.copied='';S.reportText=t;render()};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);
    else fb();
  }catch(e){fb()}
}

/* ---------- Carte (Leaflet + OpenStreetMap), application passager seulement ---------- */
function ensureMap(){
  if(MAP||!window.L)return MAP;
  mapEl=document.createElement('div');mapEl.className='mapbox';
  MAP=L.map(mapEl,{zoomControl:true});
  MAP.setView([S.centre.lat,S.centre.lon],15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© les contributeurs d’OpenStreetMap'}).addTo(MAP);
  layers.me=L.layerGroup().addTo(MAP);
  layers.veh=L.layerGroup().addTo(MAP);
  MAP.on('click',function(e){
    if(S.ride||S.tab!=='commander')return;
    S.pin={lat:e.latlng.lat,lon:e.latlng.lng};S.pickMode='pin';
    render();fitView();
  });
  return MAP;
}
function icon(cls,sz){return L.divIcon({className:'',html:'<div class="'+cls+'"></div>',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]})}
function drawMap(){
  if(!MAP)return;
  layers.me.clearLayers();layers.veh.clearLayers();
  var p=S.ride?S.ride.pickup:pickup();
  if(p){
    if(p.kind==='gps'&&p.acc)L.circle([p.lat,p.lon],{radius:p.acc,color:'#2a6fdb',weight:1,fillOpacity:0.1}).addTo(layers.me);
    L.marker([p.lat,p.lon],{icon:icon(p.kind==='pin'?'pin':'gdot',22),interactive:false,keyboard:false}).addTo(layers.me);
  }
  var vs=[];
  if(!S.ride)nearby(S.svc).forEach(function(n){vs.push(n.v)});
  else if(S.ride.status==='requested')(S.ride.cands||[]).forEach(function(n){vs.push(n.v)});
  else if(S.ride.status==='accepted'&&S.ride.near&&S.ride.sim)vs.push(S.ride.near.v);
  vs.forEach(function(v){L.marker([v.lat,v.lon],{icon:icon(v.live?'veh live':'veh',16),interactive:false,keyboard:false}).addTo(layers.veh)});
}
function fitView(){
  if(!MAP)return;
  var pts=[],p=S.ride?S.ride.pickup:pickup();
  if(p)pts.push([p.lat,p.lon]);
  if(!S.ride)nearby(S.svc).forEach(function(n){pts.push([n.v.lat,n.v.lon])});
  else if(S.ride.near&&S.ride.sim&&S.ride.status!=='done')pts.push([S.ride.near.v.lat,S.ride.near.v.lon]);
  try{
    MAP.invalidateSize();
    if(pts.length>1)MAP.fitBounds(pts,{padding:[30,30],maxZoom:17});
    else if(pts.length===1)MAP.setView(pts[0],16);
    else MAP.setView([S.centre.lat,S.centre.lon],15);
  }catch(e){}
  drawMap();
}
function attachMap(){
  var slot=$('#mapslot');if(!slot)return;
  if(!window.L){slot.innerHTML='<div class="notice">La carte ne peut pas se charger (connexion trop faible ou coupée). Le reste de l’application fonctionne.</div>';return}
  ensureMap();
  slot.appendChild(mapEl);
  if(!mapReady){mapReady=true;setTimeout(fitView,0)}
  else setTimeout(function(){try{MAP.invalidateSize()}catch(e){}drawMap()},0);
}

function driverCard(d){
  var sub=d.rate?('★ '+String(d.rate).replace('.',',')+' · '+d.trips+' courses'):'Chauffeur Man-Go';
  return '<div class="drv"><div class="ava" aria-hidden="true">'+esc(d.ini)+'</div><div class="drv-t"><b>'+esc(d.name)+'</b><span>'+esc(d.veh)+(d.plate?' · '+esc(d.plate):'')+'</span><span>'+sub+'</span></div>'+(d.ex?'<span class="tag">Démo</span>':'')+'</div>';

function vRide(r){
  var steps=['Demande','Chauffeur','En route','Arrivée'];
  var idx={requested:0,nodriver:0,accepted:1,arrived:1,ontrip:2,done:3}[r.status];
  var sh='<ol class="steps">'+steps.map(function(s,i){return '<li class="'+(i<idx?'done':i===idx?'cur':'')+'"'+(i===idx?' aria-current="step"':'')+'>'+s+'</li>'}).join('')+'</ol>';
  var reqMsg=r.sim
    ?(r.near?'Le véhicule le plus proche est à '+distLabel(r.near.m)+'. Il reçoit votre demande.':'Les chauffeurs en ligne reçoivent votre demande.')
    :(r.net?'Les chauffeurs proches reçoivent votre demande. Cela peut prendre quelques instants.':'Un chauffeur test est en ligne sur ce téléphone. Ouvrez l’application chauffeur pour accepter la course.');
  var H={
    requested:['Recherche d’un chauffeur',reqMsg],
    nodriver:['Aucun chauffeur disponible',ONLINE?'Aucun chauffeur n’a répondu à votre demande. Réessayez dans quelques instants.':'Aucun véhicule n’est disponible à moins de '+(RADIUS/1000)+' km pour l’instant.'],
    accepted:['Votre chauffeur arrive','Arrivée dans environ '+r.eta+' min.'],
    arrived:['Votre chauffeur est arrivé','Donnez-lui votre code de course.'],
    ontrip:['En route vers '+r.toN,'Bon trajet.'],
    done:['Course terminée','Merci d’avoir utilisé Man-Go.']
  }[r.status];
  var head='<div class="stat">'+(r.status==='requested'?'<div class="spin" aria-hidden="true"></div>':'')+'<div><h2>'+esc(H[0])+'</h2><p class="fine" style="margin:0">'+esc(H[1])+'</p></div></div>';
  var h='<div id="mapslot"></div><section class="card" style="display:flex;flex-direction:column;gap:14px">'+sh+head;
  if(r.driver)h+=driverCard(r.driver);
  if(r.status==='accepted'||r.status==='arrived')h+='<div class="code"><span class="lab">Code de course</span><strong>'+r.code+'</strong><p>Donnez ce code au chauffeur quand vous montez. Vous êtes sûr de monter dans le bon véhicule.</p></div>';
  h+=sumRows(r,false);
  if(r.status==='done'){
    h+='<div><span class="lab">Notez votre chauffeur</span><div class="stars" role="group" aria-label="Note sur 5">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-act="rate" data-v="'+n+'" aria-label="'+n+' sur 5" aria-pressed="'+(r.rating>=n)+'">★</button>'}).join('')+'</div>'+(r.rating?'<p class="fine" style="margin:0">Merci pour votre note.</p>':'')+'</div>';
    h+='<button type="button" class="btn primary" data-act="newride">Nouvelle course</button>';
  }else if(r.status==='nodriver'){
    h+='<div class="btns"><button type="button" class="btn primary" data-act="retry">Réessayer</button><button type="button" class="btn ghost" data-act="cancel">Annuler</button></div>';
  }else if(r.status!=='ontrip'){
    if(!r.sim&&!ONLINE&&r.status==='requested')h+='<button type="button" class="btn ghost" data-act="usedemo">Utiliser un véhicule de démonstration</button>';
    h+='<button type="button" class="btn ghost" data-act="cancel">Annuler la course</button>';
  }
  return h+'</section>';
}
function vCommander(){
  if(S.ride)return '<div class="stack">'+vRide(S.ride)+'</div>';
  return '<div class="stack"><div id="mapslot"></div>'+(S.notice?'<div class="notice" role="status">'+esc(S.notice)+'</div>':'')+vForm()+'</div>';

  var st=S.st,f=0,usual=0;

  else{var k=st.slice(2);if(P[k]&&k!==S.sf)f=special(S.sf,k)||CFG.city}
  return {f:f,usual:usual,sp:split(f)};
}

/* ---------- Rendu ---------- */
function view(){
  var t=S.tab,h;
  if(ONLINE&&APP==='gestion'&&gated())return vGate();
  if(ONLINE&&APP==='chauffeur'&&!SESS&&t==='courses')return vLogin();
  if(APP==='passager')h=t==='commander'?vCommander():vAide();
  else if(APP==='chauffeur')h=t==='courses'?vCourses():t==='dossier'?vDossier():vAide();
  else h=t==='tarifs'?vTarifs():t==='lieux'?vLieux():t==='chauffeurs'?vChauffeurs():vLaunch();
  if(ONLINE&&APP==='gestion'&&S.saveMsg)h=h.replace('<div class="stack">','<div class="stack"><div class="notice" role="status">'+esc(S.saveMsg)+'</div>');
  return h;
}
function render(){
  var ae=document.activeElement,key=null;
  if(ae&&ae!==document.body){
    if(ae.id)key='#'+ae.id;
    else if(ae.getAttribute&&ae.getAttribute('data-act'))key='[data-act="'+ae.getAttribute('data-act')+'"][data-v="'+(ae.getAttribute('data-v')||'')+'"]';
  }
  $('#app').innerHTML=vHeader()+view();
  if(key){var el=$('#app').querySelector(key);if(el&&el.focus){try{el.focus({preventScroll:true})}catch(x){}}}
  attachMap();
}
function softRender(){
  var a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){setTimeout(softRender,1500);return}
  render();
}

/* ---------- Passager : commande et suivi ---------- */
var DELAY={requested:4500,accepted:7000,arrived:5000,ontrip:8000};
var RIDE_MSG={accepted:'Votre chauffeur arrive.',arrived:'Votre chauffeur est arrivé.',ontrip:'Course en cours.',done:'Course terminée.',nodriver:'Aucun chauffeur disponible.'};
function auto(){
  clearTimeout(T);
  var r=S.ride;if(!r||!r.sim)return;
  if(r.status==='requested'&&!r.near){
    T=setTimeout(function(){if(S.ride===r&&r.status==='requested'){r.status='nodriver';announce(RIDE_MSG.nodriver);softRender()}},6000);
    return;
  }
  var d=DELAY[r.status];if(!d)return;
  var st=r.status;
  T=setTimeout(function(){
    if(S.ride!==r||r.status!==st)return;
    if(st==='requested'){r.driver=r.near.v;r.eta=r.near.eta;r.status='accepted'}
    else if(st==='accepted')r.status='arrived';
    else if(st==='arrived')r.status='ontrip';
    else if(st==='ontrip')r.status='done';
    announce(RIDE_MSG[r.status]||'');
    softRender();auto();
  },d);
}
function order(){
  var f=fare(S.svc,S.from,S.to);if(!f)return;
  if(ONLINE){orderNet(f);return}
  var c=nearby(S.svc),sp=split(f),live=!!liveDriver();
  var R={id:Date.now(),svc:S.svc,from:S.from,to:S.to,fromN:P[S.from].n,toN:placeName(S.svc,S.to),pax:S.pax,pay:S.pay,
    fare:f,com:sp.com,net:sp.net,pct:CFG.com,code:rnd(1000,9999),status:'requested',driver:null,rating:0,src:'mine',by:'passenger',
    pickup:pickup(),cands:c,near:(c[0]&&!c[0].v.live)?c[0]:null,sim:!live};
  S.ride=R;
  if(!R.sim)wr('mango_ride',R);
  announce('Demande envoyée.');
  render();fitView();auto();window.scrollTo(0,0);
}
function cancelRide(){
  var r=S.ride;if(!r)return;
  if(ONLINE){cancelNet(r);return}
  clearTimeout(T);
  if(!r.sim)wr('mango_ride',Object.assign({},r,{status:'cancelled',by:'passenger'}));
  S.ride=null;announce('Course annulée.');render();fitView();
}
function pollPassenger(){
  if(ONLINE){pollRide();return}
  var r=S.ride;if(!r||r.sim)return;
  var s=rd('mango_ride');
  if(s&&s.id===r.id&&s.by==='driver'&&s.status!==r.status&&s.status!=='cancelled'){
    r.status=s.status;r.driver=s.driver;r.eta=s.eta;
    announce(RIDE_MSG[r.status]||'');
    softRender();
  }
}

/* ---------- Chauffeur : en ligne, demandes, course ---------- */
function heartbeat(){
  if(!S.online)return;
  if(ONLINE){heartbeatNet();return}
  var g=S.gps,r=S.reg||{};
  wr('mango_live',{ts:Date.now(),name:r.name||'Chauffeur',svc:regVeh(),plate:r.plate||'',lat:g?g.lat:null,lon:g?g.lon:null,acc:g?g.acc:null});
}
function setOnline(on){
  if(on&&!approved()){
    S.notice=!S.reg?'Inscrivez-vous d’abord dans l’onglet Mon dossier.':S.reg.status==='rejected'?'Votre dossier a été refusé.':'Votre dossier n’est pas encore approuvé.';
    render();return;
  }
  S.online=on;clearInterval(IV);clearInterval(HB);
  if(on){
    S.notice='';S.requests=ONLINE?[]:[demoReq(),demoReq()];
    if(WATCH===null&&S.perm!=='denied')startGeo();
    heartbeat();HB=setInterval(heartbeat,4000);
    IV=setInterval(function(){
      if(!S.online||S.job||ONLINE)return;
      if(S.requests.length<3)S.requests.push(demoReq());
      if(S.tab==='courses')softRender();
    },12000);
  }else{S.requests=[];S.real=null;wr('mango_live',null);if(ONLINE&&SESS)rpc('go_offline').catch(function(){})}
  render();
}
function pollDriver(){
  if(ONLINE){pollDriverNet();return}
  var changed=false;
  var reg=rd('mango_reg');
  if(!S.editing&&reg&&(!S.reg||reg.status!==S.reg.status)){S.reg=reg;changed=true}
  var r=rd('mango_ride');
  if(S.online&&!S.job){
    if(r&&r.status==='requested'&&r.by==='passenger'&&!S.skipped[r.id]){if(!S.real||S.real.id!==r.id){S.real=r;changed=true}}
    else if(S.real){S.real=null;changed=true}
  }
  if(S.job&&S.job.src==='mine'&&S.job.status!=='done'&&r&&r.id===S.job.id&&r.status==='cancelled'){
    S.job=null;S.notice='Le passager a annulé la course.';changed=true;
  }
  if(changed)softRender();
}
function pushJob(){if(S.job&&S.job.src==='mine')wr('mango_ride',S.job)}
function accept(id){
  if(S.job)return;
  S.notice='';
  if(ONLINE){acceptNet(id);return}
  if(S.real&&String(S.real.id)===String(id)){
    S.job=Object.assign({},S.real,{status:'accepted',by:'driver',driver:me(),eta:rnd(2,6),src:'mine'});
    S.real=null;pushJob();
  }else{
    var q=S.requests.filter(function(x){return x.id===id})[0];if(!q)return;
    S.requests=S.requests.filter(function(x){return x.id!==id});
    S.job=Object.assign({},q,{status:'accepted',code:rnd(1000,9999)});
  }
  S.form.codeIn='';S.codeErr=false;render();
}
function startTrip(){
  var j=S.job;if(!j)return;
  if(ONLINE){startNet(j);return}
  if(String(S.form.codeIn||'').trim()===String(j.code)){j.status='ontrip';S.codeErr=false;S.form.codeIn='';pushJob();announce('Course démarrée.')}
  else S.codeErr=true;
  render();
}
function finish(){
  var j=S.job;if(!j)return;
  if(ONLINE){finishNet(j);return}
  j.status='done';
  if(!j.paid){j.paid=true;S.earn.t+=j.net;S.earn.n+=1}
  pushJob();announce('Course terminée. Gains ajoutés.');render();
}
function submitReg(){
  var F=S.form,name=(F.rn||'').trim(),ph=(F.rp||'').replace(/\D/g,'');
  ph=normPhone(F.rp||''); /* +225 suivi des 10 chiffres accepté */
  var plate=(F.rpl||'').trim();
  if(name.length<3){S.regErr='Entrez votre nom et vos prénoms.';render();return}
  if(ph.length!==10){S.regErr='Entrez un numéro de téléphone à 10 chiffres.';render();return}
  if(plate.length<4){S.regErr='Entrez la plaque d’immatriculation.';render();return}
  var rec0={name:name,phone:ph.replace(/(\d{2})(?=\d)/g,'$1 '),veh:F.rv||'taxi',plate:plate.toUpperCase(),station:F.rs||'',inter:!!F.rh,towns:F.rh?(F.towns||[]):[]};
  if(ONLINE){submitRegNet(rec0,ph,F.rw||'');return}
  S.reg={name:name,phone:ph.replace(/(\d{2})(?=\d)/g,'$1 '),veh:F.rv||'taxi',plate:plate.toUpperCase(),station:F.rs||'',inter:!!F.rh,towns:F.rh?(F.towns||[]):[],status:'pending',ts:Date.now()};
  wr('mango_reg',S.reg);S.editing=false;S.regErr='';announce('Dossier envoyé.');render();
}

/* ---------- Gestion : réglages ---------- */
function applyCfg(){saveCfg();rebuild();fixFrom();fixTo();fixSim();render()}
function cfgChange(k,v){
  if(k==='red')CFG.red=Math.max(500,num(v)||500);
  else if(k==='city')CFG.city=num(v)>=100?num(v):500;
  else if(k==='com')CFG.com=Math.min(50,num(v));
  else if(k==='q'){
    var seen={},names=[];
    String(v).split(/\r?\n/).forEach(function(x){x=x.trim();var s=slug(x);if(x&&!seen[s]){seen[s]=1;names.push(x)}});
    if(names.length<2){announce('Gardez au moins deux quartiers.');render();return}
    CFG.q=names;
  }else if(k.indexOf('t:')===0){
    var i=parseInt(k.slice(2),10);
    if(CFG.t[i]&&num(v)>0&&CFG.t[i].u!==num(v)){CFG.t[i].u=num(v);CFG.t[i].v=false}
  }else if(k.indexOf('v:')===0){
    var iv=parseInt(k.slice(2),10);if(CFG.t[iv])CFG.t[iv].v=!!v;
  }else if(k.indexOf('r:')===0){
    var j=parseInt(k.slice(2),10);
    if(CFG.routes[j]&&num(v)>=100){CFG.routes[j].p=num(v);delete CFG.routes[j].ex}
  }
  applyCfg();
}
function addTown(){
  var n=(S.form.tn||'').trim(),u=num(S.form.tu);
  if(n.length<2){S.townErr='Entrez le nom de la ville.';render();return}
  if(u<1000){S.townErr='Entrez le tarif habituel en FCFA (au moins 1 000).';render();return}
  if(CFG.t.some(function(t){return slug(t.n)===slug(n)})){S.townErr='Cette ville existe déjà.';render();return}
  CFG.t.push({n:n,u:u});S.form.tn='';S.form.tu='';S.townErr='';applyCfg();
}
function addRoute(){
  var a=$('#ra').value,b=$('#rb').value,p=num($('#rp').value);
  if(slug(a)===slug(b)){S.routeErr='Choisissez deux quartiers différents.';render();return}
  if(p<100){S.routeErr='Entrez un prix en FCFA (au moins 100).';render();return}
  CFG.routes=CFG.routes.filter(function(r){
    var ka=slug(r.a),kb=slug(r.b);
    return !((ka===slug(a)&&kb===slug(b))||(ka===slug(b)&&kb===slug(a)));
  });
  CFG.routes.push({a:a,b:b,p:p});S.routeErr='';applyCfg();
}
function setRegStatus(st){
  var r=rd('mango_reg');if(!r)return;
  r.status=st;wr('mango_reg',r);S.reg=r;render();
}
function doInstall(){
  var ev=S.installEv;if(!ev)return;
  try{ev.prompt();ev.userChoice.then(function(c){S.installEv=null;if(c&&c.outcome==='accepted')S.installed=true;render()},function(){})}catch(e){}
}

function act(a,v){
  switch(a){
    case 'tab':S.tab=v;render();window.scrollTo(0,0);break;
    case 'svc':S.svc=v;if(ONLINE)pollNear();fixTo();if(S.pax>maxPax())S.pax=maxPax();render();fitView();break;
    case 'pax':S.pax=Math.max(1,Math.min(maxPax(),S.pax+Number(v)));render();break;
    case 'pay':S.pay=v;render();break;
    case 'gps':S.pickMode='gps';S.copied='';startGeo();if(S.gps)fitView();break;
    case 'stopgps':stopGeo(false);break;
    case 'usepin':S.pickMode='pin';render();fitView();break;
    case 'atman':
      S.pin={lat:MAN.lat,lon:MAN.lon,label:'Centre de Man (test)'};S.pickMode='pin';S.centre={lat:MAN.lat,lon:MAN.lon};makeFleet();render();fitView();break;
    case 'copyrep':copyReport();break;
    case 'install':doInstall();break;
    case 'order':order();break;
    case 'retry':clearTimeout(T);S.ride=null;order();break;
    case 'cancel':cancelRide();break;
    case 'usedemo':
      if(S.ride&&!S.ride.sim){
        wr('mango_ride',Object.assign({},S.ride,{status:'cancelled',by:'passenger'}));
        S.ride.sim=true;S.ride.near=S.ride.cands&&S.ride.cands.filter(function(n){return !n.v.live})[0]||null;
        render();auto();
      }break;
    case 'rate':if(S.ride){S.ride.rating=Number(v);render()}break;
    case 'newride':if(ONLINE&&S.ride&&S.ride.id)rpc('ack_ride',{p_id:S.ride.id}).catch(function(){});if(S.ride&&!S.ride.sim)wr('mango_ride',null);S.ride=null;render();fitView();break;
    case 'online':if(!S.job)setOnline(!S.online);break;
    case 'accept':accept(v);break;
    case 'skip':
      if(S.real&&String(S.real.id)===String(v)){S.skipped[S.real.id]=1;S.real=null}
      S.skipped[v]=1;S.requests=S.requests.filter(function(x){return x.id!==v});render();break;
    case 'arrived':if(ONLINE){arriveNet();break}if(S.job){S.job.status='arrived';pushJob();announce('Arrivé au départ.');render()}break;
    case 'start':startTrip();break;
    case 'finish':finish();break;
    case 'next':S.job=null;render();break;
    case 'editreg':
      S.form={rn:S.reg.name,rp:S.reg.phone,rv:S.reg.veh,rpl:S.reg.plate,rs:S.reg.station,rh:S.reg.inter,towns:(S.reg.towns||[]).slice(),codeIn:S.form.codeIn};
      S.editing=true;render();break;
    case 'town':
      var tw=S.form.towns||[],i2=tw.indexOf(v);
      if(i2>=0)tw.splice(i2,1);else tw.push(v);
      S.form.towns=tw;render();break;
    case 'deltown':if(CFG.t.length>1){CFG.t.splice(Number(v),1);applyCfg()}break;
    case 'delroute':CFG.routes.splice(Number(v),1);applyCfg();break;
    case 'defcfg':CFG=defCfg();applyCfg();break;
    case 'approve':setRegStatus('approved');break;
    case 'reject':setRegStatus('rejected');break;
    case 'delreg':wr('mango_reg',null);S.reg=null;render();break;
    case 'dstat':var pr=String(v).split('|');setDrvStatus(pr[0],pr[1]);break;
    case 'retrycfg':S.cfgErr='';render();loadRemoteCfg();break;
    case 'logout':
      if(APP==='chauffeur'&&S.online){S.online=false;clearInterval(IV);clearInterval(HB);try{rpc('go_offline').catch(function(){})}catch(e){}}
      setSess(null);S.reg=null;S.isAdmin=undefined;S.cfgLoaded=false;S.job=null;S.requests=[];S.authErr='';S.tab=TABS[APP][0][0];render();break;
  }
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  act(b.getAttribute('data-act'),b.getAttribute('data-v'));
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.getAttribute('data-bind'),f=t.getAttribute('data-form'),c=t.getAttribute('data-cfg');
  if(k){S[k]=t.value;if(k==='from')fixTo();render()}
  if(f){S.form[f]=t.type==='checkbox'?t.checked:t.value;if(t.getAttribute('data-render'))render()}
  if(c)cfgChange(c,t.type==='checkbox'?t.checked:t.value);
});
document.addEventListener('input',function(e){
  var f=e.target.getAttribute('data-form');
  if(f&&e.target.type!=='checkbox')S.form[f]=e.target.value;
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var id=e.target.id;
  if(id==='regForm')submitReg();
  if(id==='townForm')addTown();
  if(id==='routeForm')addRoute();
  if(id==='loginForm')doLogin();
  if(id==='adminForm')doAdminLogin();
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.installEv=e;softRender()});
window.addEventListener('appinstalled',function(){S.installEv=null;S.installed=true;softRender()});

/* Les réglages faits dans la page Gestion s'appliquent aux autres pages de ce téléphone. */
function reloadCfg(){CFG=loadCfg();rebuild();fixFrom();fixTo();fixSim()}
window.addEventListener('storage',function(e){
  if(e.key==='mango_cfg'&&APP!=='gestion'){reloadCfg();softRender()}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(APP!=='gestion'){reloadCfg();if(ONLINE)loadRemoteCfg()}
  if(APP==='chauffeur')pollDriver();
  if(APP==='passager')pollPassenger();
  softRender();
});
window.addEventListener('pagehide',function(){if(APP==='chauffeur'&&S.online)wr('mango_live',null)});

if(APP==='passager')setInterval(pollPassenger,ONLINE?2500:1500);
if(APP==='chauffeur')setInterval(pollDriver,ONLINE?3500:1500);

if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}

makeFleet();
bootNet();
if(APP!=='gestion')watchPerm();
render();
})();
</script>
</body>
</html>
